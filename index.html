<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPスマホ棚卸</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{font-family:sans-serif;background:#f3f6fb;margin:0;padding:16px;}
.wrap{max-width:520px;margin:auto;}
h1{font-size:28px;}
.card{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0001;}
input,textarea,button{width:100%;box-sizing:border-box;font-size:20px;padding:14px;margin-top:8px;border-radius:10px;border:1px solid #ccc;}
button{background:#1976d2;color:white;font-weight:bold;border:none;}
.btn-row{display:flex;gap:10px;}
.btn-row button{width:50%;}
img{width:100%;max-height:320px;object-fit:contain;background:#eee;border-radius:12px;margin-top:12px;}
.small{color:#666;font-size:14px;}
.hidden{display:none;}
#reader{margin-top:12px;}
.diff{font-size:22px;font-weight:bold;margin-top:10px;}
.ok{color:#15803d;}
.ng{color:#dc2626;}
.history-row{border-top:1px solid #ddd;padding:8px 0;font-size:15px;}
label{font-weight:bold;}
</style>
</head>

<body>
<div class="wrap">
<h1>SPスマホ棚卸</h1>

<div class="card">
  <div class="small">QRが読めない場合は管理番号を直接入力</div>
  <input id="code" placeholder="例：FF-001">

  <div class="btn-row">
    <button onclick="searchItem()">検索</button>
    <button onclick="startQR()">📷QR読取</button>
  </div>

  <label style="display:block;margin-top:12px;font-weight:normal;">
    <input id="autoNext" type="checkbox" checked style="width:auto;">
    登録後、自動で次のQRを読む
  </label>

  <div id="reader"></div>
</div>

<div id="itemBox" class="card hidden">
  <h2 id="itemName"></h2>
  <div id="itemInfo"></div>
  <img id="itemPhoto">
</div>

<div class="card">
  <label>実棚数</label>
  <input id="actualQty" type="number" placeholder="数量を入力" oninput="calcDiff()">

  <div id="diffBox" class="diff"></div>

  <label>担当者</label>
  <input id="person" value="スマホ棚卸">

  <label>メモ</label>
  <textarea id="memo" placeholder="任意"></textarea>

  <button onclick="saveResult()">棚卸登録</button>
</div>

<div id="msg" class="card small">管理番号を検索してください。</div>

<div class="card">
  <h3>直近の棚卸履歴</h3>
  <button onclick="loadHistory()">履歴更新</button>
  <div id="history"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://aqoekjxffnxglplihahd.supabase.co";
const SUPABASE_KEY = "sb_publishable_me-K-qKQrbrk8yloC6vMQw_BL0uato-";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentItem = null;
let qrScanner = null;

async function searchItem(){
  const code = document.getElementById("code").value.trim();

  if(!code){
    setMsg("管理番号を入力してください。");
    return;
  }

  setMsg("検索中...");

  const { data, error } = await client
    .from("items")
    .select("*")
    .eq("code", code)
    .single();

  if(error || !data){
    currentItem = null;
    document.getElementById("itemBox").classList.add("hidden");
    document.getElementById("diffBox").textContent = "";
    setMsg("該当データがありません。");
    return;
  }

  currentItem = data;

  document.getElementById("itemName").textContent = data.name || "";

  let stockText = "";
  if(data.current_qty !== undefined && data.current_qty !== null){
    stockText = "<br>帳簿数：" + data.current_qty;
  }

  document.getElementById("itemInfo").innerHTML =
    "管理番号：" + data.code + "<br>" +
    "分類：" + (data.category || "") + "<br>" +
    "保管場所：" + (data.location || "") +
    stockText;

  const { data: urlData } = client.storage
    .from("photos")
    .getPublicUrl(data.photo_path);

  document.getElementById("itemPhoto").src = urlData.publicUrl;
  document.getElementById("itemBox").classList.remove("hidden");

  document.getElementById("actualQty").focus();
  document.getElementById("actualQty").select();

  calcDiff();
  setMsg("対象を写真で確認して実棚数を入力してください。");
}

function calcDiff(){
  const diffBox = document.getElementById("diffBox");
  diffBox.textContent = "";
  diffBox.className = "diff";

  if(!currentItem) return;

  if(currentItem.current_qty === undefined || currentItem.current_qty === null){
    return;
  }

  const actual = document.getElementById("actualQty").value;
  if(actual === "") return;

  const diff = Number(actual) - Number(currentItem.current_qty);

  if(diff === 0){
    diffBox.textContent = "差異：0";
    diffBox.classList.add("ok");
  }else{
    diffBox.textContent = "差異：" + diff;
    diffBox.classList.add("ng");
  }
}

async function saveResult(){
  if(!currentItem){
    setMsg("先に管理番号を検索してください。");
    return;
  }

  const actualQty = document.getElementById("actualQty").value;
  const person = document.getElementById("person").value.trim();
  const memo = document.getElementById("memo").value.trim();

  if(actualQty === ""){
    setMsg("実棚数を入力してください。");
    return;
  }

  setMsg("登録中...");

  const { error } = await client.from("stocktake_results").insert({
    code: currentItem.code,
    name: currentItem.name,
    actual_qty: Number(actualQty),
    person: person || "スマホ棚卸",
    memo: memo
  });

  if(error){
    setMsg("登録失敗：" + error.message);
    return;
  }

  setMsg("棚卸登録しました！");

  document.getElementById("actualQty").value = "";
  document.getElementById("memo").value = "";
  document.getElementById("diffBox").textContent = "";

  await loadHistory();

  if(document.getElementById("autoNext").checked){
    document.getElementById("code").value = "";
    currentItem = null;
    document.getElementById("itemBox").classList.add("hidden");
    setTimeout(() => startQR(), 500);
  }
}

async function startQR(){
  setMsg("カメラ起動中...");

  const reader = document.getElementById("reader");
  reader.innerHTML = "";

  if(qrScanner){
    try{ await qrScanner.stop(); }catch(e){}
    try{ await qrScanner.clear(); }catch(e){}
    qrScanner = null;
  }

  qrScanner = new Html5Qrcode("reader");

  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    async decodedText => {
      document.getElementById("code").value = decodedText;

      try{ await qrScanner.stop(); }catch(e){}
      try{ await qrScanner.clear(); }catch(e){}

      qrScanner = null;
      reader.innerHTML = "";

      searchItem();
    },
    errorMessage => {}
  ).catch(err => {
    setMsg("カメラ起動失敗：" + err);
  });
}

async function loadHistory(){
  const { data, error } = await client
    .from("stocktake_results")
    .select("*")
    .order("created_at", { ascending:false })
    .limit(10);

  const box = document.getElementById("history");

  if(error){
    box.innerHTML = "履歴取得失敗：" + error.message;
    return;
  }

  if(!data || data.length === 0){
    box.innerHTML = "履歴はまだありません。";
    return;
  }

  box.innerHTML = data.map(r =>
    "<div class='history-row'>" +
    "<b>" + r.code + "</b>　" + (r.name || "") + "<br>" +
    "実棚数：" + r.actual_qty + "　担当：" + (r.person || "") + "<br>" +
    "<span class='small'>" + (r.created_at || "") + "</span>" +
    "</div>"
  ).join("");
}

function setMsg(text){
  document.getElementById("msg").textContent = text;
}

loadHistory();
</script>
</body>
</html>
